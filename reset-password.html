<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — Vocab Keeper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 10%, var(--brand-soft), transparent 45%),
        radial-gradient(circle at 85% 90%, var(--brand-softer), transparent 50%);
      z-index: -1;
      pointer-events: none;
      opacity: 0.85;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow:
        0 20px 60px rgba(15, 23, 42, 0.08),
        0 4px 12px rgba(15, 23, 42, 0.04);
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .auth-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
      box-shadow:
        0 10px 24px var(--brand-soft),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .auth-logo svg { width: 30px; height: 30px; }
    .auth-title {
      font-family: var(--font-display);
      font-size: 28px; font-weight: 800;
      text-align: center;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .auth-subtitle {
      text-align: center;
      color: var(--text-2);
      margin: 6px 0 26px;
      font-size: 14px;
    }
    .auth-card .field { margin-bottom: 16px; }
    .auth-card .field:last-of-type { margin-bottom: 22px; }
    .auth-card .field label {
      display: block;
      font-size: 13px; font-weight: 600;
      color: var(--text-2);
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }
    .input-wrap {
      position: relative;
      display: flex; align-items: center;
    }
    .input-wrap .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-3);
      pointer-events: none;
      display: flex;
      transition: color 0.2s;
    }
    .input-wrap .input-icon svg { width: 18px; height: 18px; }
    .auth-card .field input {
      width: 100%;
      padding: 14px 14px 14px 44px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .auth-card .field input::placeholder { color: var(--text-3); }
    .auth-card .field input:hover { border-color: var(--border-strong); }
    .auth-card .field input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 4px var(--brand-soft);
    }
    .input-wrap:focus-within .input-icon { color: var(--brand); }
    .auth-card #submitBtn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700; font-size: 15px;
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow:
        0 6px 16px var(--brand-soft),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: transform 0.15s, box-shadow 0.25s, filter 0.2s;
    }
    .auth-card #submitBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow:
        0 10px 22px var(--brand-soft),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      filter: brightness(1.05);
    }
    .auth-toggle-theme {
      position: fixed; top: 20px; right: 20px;
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s, color 0.2s, border-color 0.2s;
    }
    .auth-toggle-theme:hover {
      color: var(--brand);
      border-color: var(--brand);
      transform: scale(1.05);
    }
    .auth-toggle-theme svg { width: 18px; height: 18px; }
    .auth-error, .auth-success {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px; font-weight: 500;
      margin-bottom: 14px;
      display: none;
    }
    .auth-error  { background: var(--red-soft);   color: var(--red); }
    .auth-success{ background: var(--green-soft); color: var(--green); }
    .auth-error.show, .auth-success.show {
      display: flex; align-items: center; gap: 8px;
      animation: msgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .auth-error svg, .auth-success svg { width: 16px; height: 16px; flex-shrink: 0; }
    .auth-footer {
      text-align: center;
      margin-top: 22px;
      color: var(--text-3);
      font-size: 12px;
    }
    .auth-footer a {
      color: var(--brand);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <button class="auth-toggle-theme" id="themeBtn" aria-label="Toggle theme">
    <i data-lucide="moon"></i>
  </button>

  <div class="auth-card">
    <div class="auth-logo"><i data-lucide="key-round"></i></div>
    <h1 class="auth-title">Reset Password</h1>
    <p class="auth-subtitle">ตั้งรหัสผ่านใหม่สำหรับบัญชีของคุณ</p>

    <div class="auth-error" id="authError">
      <i data-lucide="circle-alert"></i>
      <span id="authErrorText"></span>
    </div>
    <div class="auth-success" id="authSuccess">
      <i data-lucide="circle-check"></i>
      <span id="authSuccessText"></span>
    </div>

    <form id="resetForm" onsubmit="return false;">
      <div class="field">
        <label for="password">New Password</label>
        <div class="input-wrap">
          <i data-lucide="lock" class="input-icon"></i>
          <input type="password" id="password" placeholder="อย่างน้อย 6 ตัวอักษร" required autocomplete="new-password" minlength="6" />
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrap">
          <i data-lucide="lock-keyhole" class="input-icon"></i>
          <input type="password" id="confirmPassword" placeholder="ใส่รหัสผ่านอีกครั้ง" required autocomplete="new-password" minlength="6" />
        </div>
      </div>

      <button type="submit" id="submitBtn">
        <span id="submitText">Update Password</span>
      </button>
    </form>

    <p class="auth-footer">
      <a href="login.html">Back to Sign In</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    if (window.lucide) window.lucide.createIcons();

    const THEME_KEY = 'vk-theme';
    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      const btn = document.getElementById('themeBtn');
      btn.innerHTML = `<i data-lucide="${t === 'dark' ? 'sun' : 'moon'}"></i>`;
      if (window.lucide) window.lucide.createIcons({ context: btn });
    }
    const saved = localStorage.getItem(THEME_KEY);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(saved || (prefersDark ? 'dark' : 'light'));
    document.getElementById('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    function showError(msg) {
      document.getElementById('authErrorText').textContent = msg;
      document.getElementById('authError').classList.add('show');
      document.getElementById('authSuccess').classList.remove('show');
    }
    function showSuccess(msg) {
      document.getElementById('authSuccessText').textContent = msg;
      document.getElementById('authSuccess').classList.add('show');
      document.getElementById('authError').classList.remove('show');
    }
    function hideMessages() {
      document.getElementById('authError').classList.remove('show');
      document.getElementById('authSuccess').classList.remove('show');
    }
    function translateAuthError(msg) {
      if (/password should be at least/i.test(msg)) return 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
      if (/auth session missing/i.test(msg)) return 'ลิงก์กู้รหัสผ่านหมดอายุหรือไม่ถูกต้อง กรุณาขอลิงก์ใหม่';
      if (/weak password/i.test(msg)) return 'รหัสผ่านนี้ยังไม่ปลอดภัยพอ กรุณาใช้รหัสผ่านอื่น';
      return msg;
    }
    function showLinkErrorIfAny() {
      const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const queryParams = new URLSearchParams(window.location.search);
      const errorDescription = hashParams.get('error_description') || queryParams.get('error_description');
      if (errorDescription) {
        showError(decodeURIComponent(errorDescription.replace(/\+/g, ' ')));
        return true;
      }
      return false;
    }

    function lockForm(msg) {
      showError(msg);
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('password').disabled = true;
      document.getElementById('confirmPassword').disabled = true;
    }

    // ตรวจว่ามี recovery session ไหม — ป้องกันกรณี user เปิดหน้านี้ตรงๆ
    // หรือลิงก์หมดอายุ (Supabase SDK จะ parse URL hash + set session ให้อัตโนมัติ
    // ภายใน ~100ms หลังโหลด — เรา retry สั้นๆ เผื่อ async)
    (async function checkRecoverySession() {
      if (showLinkErrorIfAny()) { lockForm(document.getElementById('authErrorText').textContent); return; }
      for (let i = 0; i < 5; i++) {
        const session = await getSession();
        if (session) return; // มี session แล้ว — ใช้ฟอร์มได้
        await new Promise((r) => setTimeout(r, 200));
      }
      lockForm('ไม่พบลิงก์กู้รหัสผ่านที่ใช้งานได้ กรุณาขอลิงก์ใหม่จากหน้า Sign In');
    })();

    document.getElementById('resetForm').addEventListener('submit', async () => {
      hideMessages();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('submitBtn');
      const txt = document.getElementById('submitText');

      if (password !== confirmPassword) {
        showError('รหัสผ่านไม่ตรงกัน กรุณากรอกใหม่');
        document.getElementById('confirmPassword').focus();
        return;
      }

      btn.disabled = true;
      txt.innerHTML = '<i data-lucide="loader-2" style="animation:spin 1s linear infinite"></i> กำลังอัปเดต...';
      if (window.lucide) window.lucide.createIcons({ context: btn });

      try {
        await updatePassword(password);
        showSuccess('เปลี่ยนรหัสผ่านสำเร็จ กำลังพากลับไปหน้า Sign In');
        await supabaseClient.auth.signOut();
        window.setTimeout(() => {
          window.location.href = 'login.html';
        }, 1400);
      } catch (e) {
        showError(translateAuthError(e.message));
        btn.disabled = false;
        txt.textContent = 'Update Password';
      }
    });
  </script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
