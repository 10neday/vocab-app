<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Vocab Keeper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ========== Page background ========== */
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 10%, var(--brand-soft), transparent 45%),
        radial-gradient(circle at 85% 90%, var(--brand-softer), transparent 50%);
      z-index: -1;
      pointer-events: none;
      opacity: 0.85;
    }

    /* ========== Card ========== */
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow:
        0 20px 60px rgba(15, 23, 42, 0.08),
        0 4px 12px rgba(15, 23, 42, 0.04);
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ========== Logo + title ========== */
    .auth-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
      box-shadow:
        0 10px 24px var(--brand-soft),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .auth-logo:hover { transform: scale(1.05) rotate(-3deg); }
    .auth-logo svg { width: 30px; height: 30px; }

    .auth-title {
      font-family: var(--font-display);
      font-size: 28px; font-weight: 800;
      text-align: center;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .auth-subtitle {
      text-align: center;
      color: var(--text-2);
      margin: 6px 0 26px;
      font-size: 14px;
    }

    /* ========== Tabs ========== */
    .auth-tabs {
      display: flex;
      background: var(--surface-2);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 22px;
    }
    .auth-tab {
      flex: 1;
      padding: 11px;
      border-radius: 9px;
      font-weight: 700; font-size: 14px;
      color: var(--text-2);
      transition: color 0.2s, background 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.25s;
    }
    .auth-tab:hover:not(.active) { color: var(--text); }
    .auth-tab.active {
      background: var(--surface);
      color: var(--brand);
      box-shadow: var(--shadow-sm);
    }

    /* ========== Form fields (scope to card, override global) ========== */
    .auth-card .field { margin-bottom: 16px; }
    .auth-card .field:last-of-type { margin-bottom: 22px; }
    .auth-card .field label {
      display: block;
      font-size: 13px; font-weight: 600;
      color: var(--text-2);
      margin-bottom: 8px;
      letter-spacing: 0.01em;
    }

    .input-wrap {
      position: relative;
      display: flex; align-items: center;
    }
    .input-wrap .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-3);
      pointer-events: none;
      display: flex;
      transition: color 0.2s;
    }
    .input-wrap .input-icon svg { width: 18px; height: 18px; }

    .auth-card .field input {
      width: 100%;
      padding: 14px 14px 14px 44px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .auth-card .field input::placeholder { color: var(--text-3); }
    .auth-card .field input:hover { border-color: var(--border-strong); }
    .auth-card .field input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 4px var(--brand-soft);
    }
    .input-wrap:focus-within .input-icon { color: var(--brand); }

    .forgot-row {
      margin: -6px 0 16px;
      display: flex;
      justify-content: flex-end;
    }
    .forgot-link {
      color: var(--brand);
      font-size: 13px;
      font-weight: 700;
      transition: color 0.2s, opacity 0.2s;
    }
    .forgot-link:hover { opacity: 0.8; }

    /* ========== Submit button ========== */
    .auth-card #submitBtn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700; font-size: 15px;
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow:
        0 6px 16px var(--brand-soft),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: transform 0.15s, box-shadow 0.25s, filter 0.2s;
    }
    .auth-card #submitBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow:
        0 10px 22px var(--brand-soft),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      filter: brightness(1.05);
    }
    .auth-card #submitBtn:active:not(:disabled) { transform: translateY(0); }

    /* ========== Theme toggle ========== */
    .auth-toggle-theme {
      position: fixed; top: 20px; right: 20px;
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s, color 0.2s, border-color 0.2s;
    }
    .auth-toggle-theme:hover {
      color: var(--brand);
      border-color: var(--brand);
      transform: scale(1.05);
    }
    .auth-toggle-theme svg { width: 18px; height: 18px; }

    /* ========== Error / success ========== */
    .auth-error, .auth-success {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px; font-weight: 500;
      margin-bottom: 14px;
      display: none;
    }
    .auth-error  { background: var(--red-soft);   color: var(--red); }
    .auth-success{ background: var(--green-soft); color: var(--green); }
    .auth-error.show, .auth-success.show {
      display: flex; align-items: center; gap: 8px;
      animation: msgIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .auth-error svg, .auth-success svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ========== Footer ========== */
    .auth-footer {
      text-align: center;
      margin-top: 22px;
      color: var(--text-3);
      font-size: 12px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .auth-footer svg { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <button class="auth-toggle-theme" id="themeBtn" aria-label="Toggle theme">
    <i data-lucide="moon"></i>
  </button>

  <div class="auth-card">
    <div class="auth-logo"><i data-lucide="book-open"></i></div>
    <h1 class="auth-title">Vocab Keeper</h1>
    <p class="auth-subtitle">เรียนรู้คำศัพท์ภาษาอังกฤษอย่างเป็นระบบ</p>

    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="signin">Sign In</button>
      <button class="auth-tab" data-mode="signup">Sign Up</button>
    </div>

    <div class="auth-error" id="authError">
      <i data-lucide="circle-alert"></i>
      <span id="authErrorText"></span>
    </div>
    <div class="auth-success" id="authSuccess">
      <i data-lucide="circle-check"></i>
      <span id="authSuccessText"></span>
    </div>

    <form id="authForm" onsubmit="return false;">
      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <i data-lucide="mail" class="input-icon"></i>
          <input type="email" id="email" placeholder="your@email.com" required autocomplete="email" />
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i data-lucide="lock" class="input-icon"></i>
          <input type="password" id="password" placeholder="อย่างน้อย 6 ตัวอักษร" required autocomplete="current-password" minlength="6" />
        </div>
      </div>

      <div class="forgot-row" id="forgotRow">
        <button type="button" class="forgot-link" id="forgotBtn">Forgot password?</button>
      </div>

      <div class="field" id="confirmField" hidden>
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrap">
          <i data-lucide="lock-keyhole" class="input-icon"></i>
          <input type="password" id="confirmPassword" placeholder="ใส่รหัสผ่านอีกครั้ง" autocomplete="new-password" minlength="6" />
        </div>
      </div>

      <button type="submit" id="submitBtn">
        <span id="submitText">Sign In</span>
      </button>
    </form>

    <p class="auth-footer">
      <i data-lucide="shield-check"></i>
      Your data is protected with Row Level Security
    </p>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    // ----------- Render initial icons -----------
    if (window.lucide) window.lucide.createIcons();

    // ----------- Theme -----------
    const THEME_KEY = 'vk-theme';
    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      const btn = document.getElementById('themeBtn');
      btn.innerHTML = `<i data-lucide="${t === 'dark' ? 'sun' : 'moon'}"></i>`;
      if (window.lucide) window.lucide.createIcons({ context: btn });
    }
    const saved = localStorage.getItem(THEME_KEY);
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(saved || (prefersDark ? 'dark' : 'light'));
    document.getElementById('themeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });

    // ----------- Redirect if already logged in -----------
    redirectIfAuthed();

    // ----------- Tabs -----------
    let mode = 'signin';
    const confirmField = document.getElementById('confirmField');
    const confirmInput = document.getElementById('confirmPassword');
    document.querySelectorAll('.auth-tab').forEach((tab) => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        mode = tab.dataset.mode;
        document.getElementById('submitText').textContent = mode === 'signin' ? 'Sign In' : 'Sign Up';
        document.getElementById('password').autocomplete =
          mode === 'signin' ? 'current-password' : 'new-password';
        // Show/hide confirm field
        const isSignup = mode === 'signup';
        confirmField.hidden = !isSignup;
        confirmInput.required = isSignup;
        document.getElementById('forgotRow').hidden = isSignup;
        if (!isSignup) confirmInput.value = '';
        hideMessages();
      });
    });

    // ----------- Messages -----------
    function showError(msg) {
      document.getElementById('authErrorText').textContent = msg;
      document.getElementById('authError').classList.add('show');
      document.getElementById('authSuccess').classList.remove('show');
    }
    function showSuccess(msg) {
      document.getElementById('authSuccessText').textContent = msg;
      document.getElementById('authSuccess').classList.add('show');
      document.getElementById('authError').classList.remove('show');
    }
    function hideMessages() {
      document.getElementById('authError').classList.remove('show');
      document.getElementById('authSuccess').classList.remove('show');
    }

    // Cooldown — กันสแปม + Supabase rate limit (Free tier: 3-4 req/hour ต่อ user)
    let forgotCooldownUntil = 0;
    document.getElementById('forgotBtn').addEventListener('click', async () => {
      hideMessages();
      const email = document.getElementById('email').value.trim();
      const forgotBtn = document.getElementById('forgotBtn');
      const originalText = 'Forgot password?';

      // Cooldown active?
      const remaining = Math.ceil((forgotCooldownUntil - Date.now()) / 1000);
      if (remaining > 0) {
        showError(`โปรดรอ ${remaining} วินาที ก่อนขอลิงก์ใหม่`);
        return;
      }

      if (!email) {
        showError('กรุณากรอกอีเมลก่อน แล้วกด Forgot password อีกครั้ง');
        document.getElementById('email').focus();
        return;
      }

      forgotBtn.disabled = true;
      forgotBtn.textContent = 'Sending...';

      try {
        const redirectTo = new URL('reset-password.html', window.location.href).href;
        await sendPasswordReset(email, redirectTo);
        showSuccess('ส่งลิงก์กู้รหัสผ่านแล้ว กรุณาตรวจสอบอีเมลของคุณ');
        // Start 30s cooldown after successful send
        forgotCooldownUntil = Date.now() + 30000;
        let secs = 30;
        const tick = setInterval(() => {
          secs--;
          if (secs <= 0) {
            clearInterval(tick);
            forgotBtn.disabled = false;
            forgotBtn.textContent = originalText;
          } else {
            forgotBtn.textContent = `Resend in ${secs}s`;
          }
        }, 1000);
        forgotBtn.textContent = `Resend in ${secs}s`;
      } catch (e) {
        showError(translateAuthError(e.message));
        forgotBtn.disabled = false;
        forgotBtn.textContent = originalText;
      }
    });

    // ----------- Submit -----------
    document.getElementById('authForm').addEventListener('submit', async () => {
      hideMessages();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const txt = document.getElementById('submitText');
      const originalText = txt.textContent;

      // Confirm password (เฉพาะ Sign Up)
      if (mode === 'signup' && password !== confirmInput.value) {
        showError('รหัสผ่านไม่ตรงกัน กรุณากรอกใหม่');
        confirmInput.focus();
        return;
      }

      btn.disabled = true;
      txt.innerHTML = '<i data-lucide="loader-2" style="animation:spin 1s linear infinite"></i> กำลังดำเนินการ...';

      try {
        if (mode === 'signin') {
          await signIn(email, password);
          window.location.href = 'index.html';
        } else {
          const data = await signUp(email, password);
          if (data.user && !data.session) {
            // ต้องยืนยันอีเมล
            showSuccess('สมัครสำเร็จ! กรุณายืนยันอีเมลก่อน Sign In');
          } else {
            // login อัตโนมัติ
            window.location.href = 'index.html';
          }
        }
      } catch (e) {
        showError(translateAuthError(e.message));
        btn.disabled = false;
        txt.textContent = originalText;
      }
    });

    function translateAuthError(msg) {
      if (/invalid login credentials/i.test(msg)) return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
      if (/user already registered/i.test(msg)) return 'อีเมลนี้สมัครไว้แล้ว ลอง Sign In แทน';
      if (/password should be at least/i.test(msg)) return 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
      if (/invalid email/i.test(msg)) return 'รูปแบบอีเมลไม่ถูกต้อง';
      if (/email rate limit exceeded/i.test(msg)) return 'ส่งอีเมลบ่อยเกินไป กรุณารอสักครู่แล้วลองใหม่';
      return msg;
    }
  </script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
